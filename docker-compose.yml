services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /volume1/docker/visit_calendar/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 호스트 포트를 열지 않는다 — 내부 네트워크로만 접근

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      # AUTH_URL을 고정하지 않는다 — 집 안에서는 http://<NAS IP>:8080, 밖에서는 https://visit.<DDNS>로
      # 접속하므로 요청 호스트를 그대로 신뢰한다 (2026-09-07). DSM 역방향 프록시가 X-Forwarded-* 를 넘긴다
      AUTH_TRUST_HOST: "true"
      UPLOAD_DIR: /data/uploads
    volumes:
      - /volume1/docker/visit_calendar/uploads:/data/uploads
    ports:
      - "127.0.0.1:3000:3000"

  # Cloudflare Tunnel (2026-09-08): NAS가 Cloudflare로 바깥 방향 연결을 맺어 visit.seonso.com 트래픽을 받는다.
  # 공유기 포트 포워딩·동시 연결 제한·NAT 루프백을 모두 우회한다. 토큰은 .env의 CLOUDFLARE_TUNNEL_TOKEN (Zero Trust 무료 플랜).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
